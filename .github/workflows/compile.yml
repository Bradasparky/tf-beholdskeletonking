name: Compile Plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    branches:
      - main

env: 
  PLUGIN_NAME: beholdskeletonking

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sm-version: 
          - '1.12.x'

    outputs:
      plugin-version: ${{ steps.setup_sp.outputs.plugin-version }}
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup SourcePawn
        uses: rumblefrog/setup-sp@master
        id: setup_sp
        with:
          version: ${{ matrix.sm-version }}
          version-file: ./addons/sourcemod/scripting/${{ env.PLUGIN_NAME }}.sp
          define-name: PLUGIN_VERSION
      
      - name: Compile plugin
        run: |
          mkdir -p ${{ env.PLUGIN_NAME }}/addons/sourcemod/plugins/
          spcomp -i addons/sourcemod/scripting/include addons/sourcemod/scripting/${{ env.PLUGIN_NAME }}.sp -o ${{ env.PLUGIN_NAME }}/addons/sourcemod/plugins/${{ env.PLUGIN_NAME }}.smx
          
      - name: Zip files
        run: |
          mkdir -p ${{ env.PLUGIN_NAME }}
          cp -r addons ${{ env.PLUGIN_NAME }}/
          cp -r custom ${{ env.PLUGIN_NAME }}/
          zip -r ${{ github.event.repository.name }}_v${{ steps.setup_sp.outputs.plugin-version }}.zip ${{ env.PLUGIN_NAME }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}
          path: ${{ github.event.repository.name }}_v${{ steps.setup_sp.outputs.plugin-version }}.zip

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}
          path: .

      - name: Create release
        id: create_release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ needs.build.outputs.plugin-version }}
          artifacts: ${{ github.event.repository.name }}_v${{ needs.build.outputs.plugin-version }}.zip
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          skipIfReleaseExists: true
